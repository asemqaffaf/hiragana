<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiragana in 14 days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F7F3; --surface:#FFFFFF; --ink:#262422; --pencil:#716F69; --line:#DDE2DA;
  --grid:#B7D2C8; --guide:#EBB4AC; --jade:#2A7361; --jade-ink:#FFFFFF; --jade-soft:#E1EEE9;
  --red:#CC3226; --red-soft:#FBE6E2; --shadow:0 1px 0 rgba(38,36,34,.06);
  --kana:"Klee One","UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","YuKyokasho","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15221D; --surface:#1B2B25; --ink:#ECE9E1; --pencil:#A3ADA7; --line:#2A3D36;
    --grid:#3A5A4F; --guide:#6A4540; --jade:#7CC8B3; --jade-ink:#10201A; --jade-soft:#22403A;
    --red:#FF8574; --red-soft:#3A2622; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15221D; --surface:#1B2B25; --ink:#ECE9E1; --pencil:#A3ADA7; --line:#2A3D36;
  --grid:#3A5A4F; --guide:#6A4540; --jade:#7CC8B3; --jade-ink:#10201A; --jade-soft:#22403A;
  --red:#FF8574; --red-soft:#3A2622; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
img,svg{max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 110px}
header.top{max-width:720px;margin:0 auto;padding:18px 16px 0;display:flex;align-items:flex-start;gap:12px}
header.top .ttl{flex:1;min-width:0;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.who{flex:0 1 auto;max-width:48%;display:flex;align-items:center;gap:8px;min-height:44px;padding-block:4px;padding-inline:4px 14px;border-radius:999px;border:1.5px solid var(--grid);background:var(--surface);margin-top:2px}
.who[hidden]{display:none}
.who .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;line-height:1}
.av.lg{width:56px;height:56px;font-size:26px}
body.signed-out nav.tabs{display:none}
.backbar{margin:-10px 0 2px}
.backbar[hidden]{display:none}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px 0 0;border:0;background:none;color:var(--jade);font-weight:700;font-size:15px}
.back svg{width:20px;height:20px;flex:0 0 auto}
[dir="rtl"] .back{padding:0 0 0 12px}
[dir="rtl"] .back svg{transform:scaleX(-1)}
#login[hidden]{display:none}
.students{display:grid;gap:10px;margin:16px 0 8px}
.student{display:flex;align-items:center;gap:14px;text-align:start;padding:12px 14px;border-radius:12px;border:1.5px solid var(--grid);background:var(--surface);min-height:72px;box-shadow:var(--shadow)}
.student .av{width:44px;height:44px;font-size:20px}
.student .sn{display:flex;flex-direction:column;min-width:0}
.student b{font-size:18px;overflow-wrap:anywhere}
.sform{max-width:420px}
.sform .field input{max-width:none;width:100%}
.swatches{border:0;padding:0;margin:14px 0 0;display:flex;gap:10px;flex-wrap:wrap}
.swatches legend{padding:0;margin-bottom:8px}
.sw{position:relative;display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw .dotc{width:36px;height:36px;border-radius:50%;background:var(--c);pointer-events:none}
.sw input:checked + .dotc{box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--ink)}
.sw input:focus-visible + .dotc{outline:3px solid var(--jade);outline-offset:5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fmsg{color:var(--red);min-height:22px;margin:10px 0 0;font-weight:500}
.fmsg:empty{min-height:0;margin:0}
.note.warn{border-inline-start-color:var(--red)}
.imp{margin-top:22px}
.imp .link{padding-inline-start:0}
.phead{display:flex;align-items:center;gap:14px}
.phead h2{margin:0;overflow-wrap:anywhere}
.pstats{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:18px 0 4px}
.pstats dt{color:var(--pencil);font-size:14px;padding-top:1px}
.pstats dd{margin:0;font-size:15px}
header.top h1{font-family:var(--kana);font-weight:600;font-size:34px;line-height:1.1;margin:0;letter-spacing:.02em}
header.top p{margin:0;color:var(--pencil);font-size:14px}
h2{font-family:var(--kana);font-weight:600;font-size:28px;line-height:1.2;margin:0 0 4px}
h3{font-size:17px;font-weight:700;margin:28px 0 10px}
p{margin:0 0 10px}
.muted{color:var(--pencil)}
.small{font-size:14px}
.tab[hidden]{display:none}

/* practice square: the paper cell with a dashed cross guide */
.sq{position:relative;aspect-ratio:1/1;background:var(--surface);border:1.5px solid var(--grid);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none}
.sq::before{left:50%;top:4px;bottom:4px;border-left:1px dashed var(--guide)}
.sq::after{top:50%;left:4px;right:4px;border-top:1px dashed var(--guide)}
.sq .k{font-family:var(--kana);line-height:1;position:relative;z-index:1}
button.sq{box-shadow:var(--shadow)}
button.sq:active{transform:translateY(1px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:8px;border:1.5px solid var(--grid);background:var(--surface);font-weight:500}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:700}
.btn.red{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 140px}
.link{background:none;border:0;padding:6px 2px;color:var(--jade);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--grid);background:var(--surface);font-size:15px}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:700}
.chip .kana{font-family:var(--kana);font-size:17px}
.seg{display:flex;border:1.5px solid var(--grid);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;border:0;background:none;border-inline-end:1.5px solid var(--grid);font-weight:500}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink);font-weight:700}

/* bottom tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{min-height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:13px;color:var(--pencil)}
nav.tabs button .g{font-family:var(--kana);font-size:21px;line-height:1.1;color:var(--pencil)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-selected="true"] .g{color:var(--red)}

/* plan */
.today{margin-top:6px}
.today .date{color:var(--pencil)}
.today .date{margin-bottom:0}
.dtitle{font-weight:700;font-size:18px;margin:2px 0 0}
.focus{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px 8px;margin:14px 0 6px}
.focus .k{font-size:36px}
.focus.dense{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}
.focus.dense .k{font-size:26px}
.kb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.kb .sq{width:100%;box-shadow:var(--shadow)}
.kb:active .sq{transform:translateY(1px)}
.kb .r{font-size:12px;color:var(--pencil);text-align:center;line-height:1.2}
.kb .m{display:block;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;margin:1px 6px 0}
.kb .m::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:calc(var(--m,0)*100%);background:var(--jade)}
ol.tasks{margin:12px 0 0;padding-inline-start:22px}
ol.tasks li{margin:0 0 8px;padding-inline-start:4px}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.meter i{display:block;height:100%}
.meter .s{background:var(--jade)} .meter .l{background:var(--grid)}
.days{border-top:1.5px solid var(--line)}
.days details{border-bottom:1.5px solid var(--line)}
.days summary{list-style:none;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:12px 2px;cursor:pointer}
.days summary::-webkit-details-marker{display:none}
.dn{position:relative;width:38px;height:38px;display:grid;place-items:center;font-weight:700;font-size:15px}
.dn svg{position:absolute;inset:-3px;width:44px;height:44px;overflow:visible}
.dn svg circle{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round}
.days .t{font-weight:500}
.days .d{font-size:13px;color:var(--pencil)}
.days summary .kp{font-family:var(--kana);color:var(--pencil);font-size:15px;text-align:end;max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.days .body{padding-block:0 14px;padding-inline:56px 2px}
.days details.cur summary .t{color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.field input{min-height:46px;padding:0 12px;border-radius:8px;border:1.5px solid var(--grid);background:var(--surface);max-width:220px}
.note{border-inline-start:3px solid var(--grid);padding-block:4px;padding-inline:14px 0;margin:12px 0;color:var(--ink)}
footer.credit{margin-top:34px;font-size:13px;color:var(--pencil)}
footer.credit a{color:inherit}

/* chart */
.chart{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 6px;margin-top:14px}
.chart.y3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:330px}
.chart .hd{font-size:12px;color:var(--pencil);text-align:center;padding-bottom:2px}
.cell .k{font-size:30px}
.chart.y3 .cell .k{font-size:32px}
.blank{aspect-ratio:1/1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90%;overflow:auto;background:var(--paper);border-radius:14px 14px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--grid);margin:0 auto 12px}
.sheet .big{display:flex;gap:10px;align-items:center}
.sheet .big .sq{width:min(46vw,190px)}
.sheet .big .sq .k.txt{font-size:clamp(56px,17vw,78px)}
.sheet .rom{font-size:40px;font-weight:700;line-height:1;margin-inline-start:8px}
.sheet .rom small{display:block;font-size:14px;font-weight:400;color:var(--pencil);margin-top:6px}
.sheet .hook{font-size:17px;margin-top:14px}

/* stroke svg */
svg.strokes{position:absolute;inset:6%;width:88%;height:88%;z-index:1;overflow:visible}
svg.strokes path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.strokes .gd path{stroke:var(--grid);stroke-width:3.4}
svg.strokes .ik path{stroke:var(--ink);stroke-width:3.6}
svg.strokes .nm text{font-size:7.5px;fill:var(--red);font-family:var(--ui)}
svg.strokes.no-guide .gd{display:none}
svg.strokes.no-num .nm{display:none}

/* drill */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.count{font-size:14px;color:var(--pencil);min-width:56px;text-align:end}
.qsq{width:min(64vw,230px);margin:0 auto}
.qsq .k{font-size:clamp(90px,34vw,140px)}
.qsq.two{width:auto;display:flex;gap:6px;justify-content:center;background:none;border:0;aspect-ratio:auto}
.qsq.two::before,.qsq.two::after{display:none}
.prompt{font-size:56px;font-weight:700;text-align:center;line-height:1.1;margin:10px 0 18px}
.answer{max-width:380px;margin:18px auto 0}
.answer input{width:100%;min-height:54px;font-size:22px;text-align:center;border-radius:8px;border:1.5px solid var(--grid);background:var(--surface);letter-spacing:.04em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;margin:0 auto}
.choices .sq .k{font-size:clamp(46px,15vw,64px)}
.fb{max-width:420px;margin:18px auto 0;padding:14px 16px;border-radius:10px;background:var(--red-soft)}
.fb .ans{font-size:22px;font-weight:700}
.fb .ans .kana{font-family:var(--kana);font-size:28px}
.mark{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.mark circle,.mark path{fill:none;stroke:var(--red);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.mark.ok circle{opacity:.9;animation:draw .42s ease-out forwards}
.mark.no path{opacity:.9;animation:draw .36s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.flash{min-height:30px;text-align:center;font-size:22px;font-weight:700;color:var(--red);margin-top:8px}
.result{font-family:var(--kana);font-size:64px;font-weight:600;line-height:1;margin:10px 0 6px}
.missed{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.modes{display:grid;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:start;padding:12px 14px;border-radius:10px;border:1.5px solid var(--grid);background:var(--surface)}
.mode b{font-size:16px}
.mode span{font-size:14px;color:var(--pencil)}
.mode[aria-pressed="true"]{border-color:var(--jade);box-shadow:inset 0 0 0 1.5px var(--jade);background:var(--jade-soft)}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--jade);font-weight:700;padding:6px 0}

/* write */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-top:10px}
.strip .sq{flex:0 0 54px}
.strip .sq .k{font-size:28px}
.strip .sq[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.wsq{width:min(100%,360px,calc(100svh - 460px));min-width:min(100%,200px);margin:6px auto 0;touch-action:none}
.rowpick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:10px -2px 0;-webkit-overflow-scrolling:touch}
.rowpick::-webkit-scrollbar{display:none}
.rowpick .chip{flex:0 0 auto}
.wgrid{display:grid;grid-template-columns:1fr;gap:0}
.wleft{min-width:0}
.wright{min-width:0}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:5px;margin:10px auto 0;max-width:420px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 2px;border-radius:10px;border:1.5px solid var(--grid);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);line-height:1.2}
.tool svg{width:22px;height:22px;flex:0 0 auto}
.tool.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:700}
.tool[disabled]{opacity:.4;cursor:not-allowed}
.tool:active{transform:translateY(1px)}
[dir="rtl"] .tool .mir{transform:scaleX(-1)}
.opts{margin-top:8px;gap:4px 14px;font-size:14px}
.opts label{min-height:36px}
.wtips{max-width:420px;margin:6px auto 0}
.wtips summary{font-size:14px}
@media (max-width:599px){
  body:not(.signed-out) header.top p{display:none}
  body:not(.signed-out) header.top{padding-top:12px}
  #tab-write > h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #tab-write .rowpick{margin-top:2px}
  .wmeta{margin-top:2px}
}
@media (max-height:720px) and (max-width:699px){
  .rowpick .chip{min-height:34px;padding:0 11px}
  .strip{padding-bottom:4px;margin-top:6px}
  .strip .sq{flex-basis:46px}
  .strip .sq .k{font-size:24px}
  .back{min-height:34px}
  .wsq{width:min(100%,360px,calc(100svh - 434px))}
  .tool{min-height:50px}
}
@media (min-width:700px){
  .wgrid{grid-template-columns:minmax(300px,360px) 1fr;gap:24px;align-items:start;margin-top:4px}
  .wsq{width:100%;margin-top:6px}
  .wright{padding-top:34px}
  .wright .wstat{text-align:start;margin:0;max-width:none}
  .wright .tools,.wright .wdone,.wright .wtips{margin-inline:0;max-width:none}
  .wright .opts{justify-content:flex-start}
}
.wsq canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none;cursor:crosshair;transition:opacity .25s}
.wmeta{margin:6px 0 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.wmeta b{font-size:20px}
.wstat{min-height:46px;max-width:380px;margin:8px auto 0;text-align:center;font-size:16px;line-height:1.45}
.wstat.good{color:var(--jade);font-weight:500}
.wstat.bad{color:var(--red);font-weight:500}
.wdone{max-width:380px;margin:2px auto 0}
.wdone[hidden]{display:none}
.wdone .kana{font-family:var(--kana);font-size:19px}
.strip .sq .wm{position:absolute;left:7px;right:7px;bottom:5px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;z-index:1}
.strip .sq .wm::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:calc(var(--m,0)*100%);background:var(--jade)}
svg.strokes .ht path{stroke:var(--red);stroke-width:4.4;opacity:.8}
svg.strokes .ht circle{fill:var(--red)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:15px}
.toggles label{display:flex;align-items:center;gap:6px;min-height:40px}
.toggles input{width:20px;height:20px;accent-color:var(--jade)}

/* read */
.rules{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:4px 16px;margin:12px 0}
.rules summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--jade)}
.rules[open]{padding-bottom:14px}
.rules p{margin:0 0 8px}
.rules p:last-child{margin:0}
.rules .kana{font-family:var(--kana);font-size:18px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.word{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:start;padding-block:12px;padding-inline:14px 44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:74px}
.word .kana{font-family:var(--kana);font-size:24px;line-height:1.25}
.word .ro,.word .mean{font-size:14px;color:var(--pencil);visibility:hidden}
.word .ro{color:var(--ink);font-weight:500}
.word.open .ro,.word.open .mean,.show-ro .word .ro,.show-mean .word .mean{visibility:visible}
.say{position:absolute;inset-inline-end:6px;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--pencil)}
.say svg{width:20px;height:20px}
.sentences{display:grid;gap:8px}
.sentences .word{padding-inline-end:48px}
.sentences .word .kana{font-size:22px}
.bigsay{width:120px;height:120px;border-radius:50%;margin:6px auto 20px;display:grid;place-items:center;border:1.5px solid var(--grid);background:var(--surface);color:var(--jade)}
.bigsay svg{width:48px;height:48px}
.qsq.yo .k{font-size:clamp(60px,20vw,86px)}
.focus.yo{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
.focus.yo .k{font-size:21px}
.missed .kb{width:64px}
.missed .k{font-size:30px}
.sheet .big{flex-wrap:wrap}

/* Arabic: right-to-left text, Arabic typeface; the writing and drawing surfaces stay left-to-right */
html[lang="ar"]{--ui:"IBM Plex Sans Arabic","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
html[lang="ar"] body{font-size:16.5px;line-height:1.75}
html[lang="ar"] header.top p{font-size:14.5px}
html[lang="ar"] .hook{line-height:1.8}
.wsq,.qsq,.sheet .big .sq,svg.strokes{direction:ltr}
.ltr{direction:ltr;unicode-bidi:isolate}
.kb .r,.cell .r,.prompt,#qflash,.word .ro,.word .kana{direction:ltr;unicode-bidi:isolate}
html[lang="ar"] .word{align-items:flex-start}
html[lang="ar"] .word .kana,html[lang="ar"] .word .ro{align-self:flex-start;text-align:start}
.langseg{max-width:260px;margin:4px 0 14px;margin-inline-start:auto}
.langseg button{font-size:15px}
.langrow{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.langrow .seg{flex:1;max-width:280px}
/* progress page: one jade ramp, light to dark, for magnitude; text stays in ink colours */
:root{--s0:var(--line);--s1:#CFE5DD;--s2:#8CC3B1;--s3:#4E9A84;--s4:#2A7361}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#24423A;--s2:#2F6A5A;--s3:#4E9A84;--s4:#7CC8B3}}
nav.tabs button{font-size:12px}
.pstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px 10px;margin:16px 0 4px}
.pstat div{display:flex;flex-direction:column;gap:2px;border-inline-start:3px solid var(--s3);padding-inline-start:10px}
.pstat b{font-size:28px;line-height:1.1;font-weight:700}
.pstat span{font-size:13px;color:var(--pencil);line-height:1.3}
.road{list-style:none;margin:14px 0 0;padding:0;position:relative}
.road li{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:18px}
.road li::before{content:"";position:absolute;inset-inline-start:16px;top:30px;bottom:0;border-inline-start:2px solid var(--line)}
.road li:last-child::before{display:none}
.road li.done::before{border-color:var(--s3)}
.road .node{width:34px;height:34px;border-radius:50%;border:2px solid var(--grid);background:var(--surface);position:relative}
.road .node svg{position:absolute;inset:-4px;width:42px;height:42px;overflow:visible}
.road .node circle{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}
.road li.done .node{border-color:var(--s3)}
.road li.now .node{border:3px solid var(--jade);box-shadow:0 0 0 4px var(--jade-soft)}
.road li.later .node{border-style:dashed}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rbar{height:8px;border-radius:4px;background:var(--s0);overflow:hidden;margin:6px 0 4px}
.rbar i{display:block;height:100%;border-radius:4px;background:var(--s4)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;border:1.5px solid var(--grid);margin-inline-start:6px}
.tag.now{border-color:var(--jade);color:var(--jade)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.mapt{margin:12px 0 4px;color:var(--pencil)}
.cmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:2px}
.cmap.yo{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
.cmap button{aspect-ratio:1/1;border:0;border-radius:4px;font-family:var(--kana);font-size:17px;padding:0;color:var(--ink)}
.cmap.yo button{aspect-ratio:auto;min-height:34px;font-size:15px}
.lv-new{background:var(--s0)}
.lv-learning{background:var(--s2)}
.lv-solid{background:var(--s4);color:var(--jade-ink) !important}
.cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;margin-top:10px;max-width:520px}
.cal i{display:block;min-width:0;aspect-ratio:1/1;border-radius:4px;background:var(--s0)}
.cal i.a1{background:var(--s1)}.cal i.a2{background:var(--s2)}.cal i.a3{background:var(--s3)}.cal i.a4{background:var(--s4)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.calx{display:flex;justify-content:space-between;max-width:520px;margin-top:4px}
.rounds{position:relative;display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:12px;border-bottom:1.5px solid var(--grid);max-width:520px}
.rounds i{flex:1;max-width:30px;background:var(--s4);border-radius:4px 4px 0 0}
.rounds .goal{position:absolute;inset-inline:0;border-top:1.5px dashed var(--pencil)}
/* completed letters: a small red まる in the corner */
.strip .sq.cl::after,.kb.cl .sq::after,.cmap button.cl::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--red);background:var(--surface);z-index:2}
.cmap button{position:relative}
.legend i.lv-cl{background:var(--surface);border:2px solid var(--red);border-radius:50%}
.wcomp{margin:4px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.tag.done{border-color:var(--red);color:var(--red);margin-inline-start:0}
.wdone{flex-wrap:wrap}
.btn[hidden],.tool[hidden]{display:none}
/* profile page */
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av.avkana{font-family:var(--kana);font-weight:600}
.av.xl{width:84px;height:84px;font-size:38px}
.phero{display:flex;gap:16px;align-items:center;margin-top:4px}
.phero > div{flex:1;min-width:0}
.phero h2{margin:0;overflow-wrap:anywhere}
.lvname{margin:2px 0 6px;font-weight:700;color:var(--jade)}
.xpbar,.goalbar{height:10px;border-radius:5px;background:var(--s0);overflow:hidden;margin:6px 0 4px}
.xpbar i,.goalbar i{display:block;height:100%;border-radius:5px;background:var(--s4)}
#tab-profile h4{font-size:15px;margin:18px 0 8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.badge{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px;border-radius:10px;border:1.5px dashed var(--grid);background:var(--surface)}
.badge .bk{grid-row:1/3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--kana);font-size:22px;font-weight:600;color:var(--pencil);border:2px solid var(--line)}
.badge b{font-size:14px;line-height:1.25}
.badge .small{line-height:1.3}
.badge.got{border-style:solid;border-color:var(--grid)}
.badge.got .bk{color:var(--red);border-color:var(--red)}
.badge:not(.got) b{color:var(--pencil)}
.racc{display:grid;gap:6px;max-width:520px}
.rr{display:grid;grid-template-columns:44px 1fr 74px;align-items:center;gap:10px}
.rr .kana{font-size:18px}
.rr .rbar{margin:0}
.mixl{margin:0;padding-inline-start:20px}
.mixl li{margin:4px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
.field select{min-height:46px;padding:0 10px;border-radius:8px;border:1.5px solid var(--grid);background:var(--surface);width:100%;max-width:none}
.pform{max-width:640px}
.avpick{border:0;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:4px 16px}
.avpick legend{padding:0;margin-bottom:6px}
.avpick label{display:flex;align-items:center;gap:6px;min-height:40px}
.avopts [hidden]{display:none}
.avp{flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px}
.fmsg.ok{color:var(--jade)}
.ex{margin:8px 0 0;font-size:16px}
.ex .kana{font-size:20px}
.mins{height:90px}
#toast{position:fixed;inset-inline:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:60;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:none}
#toast .tk{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;font-family:var(--kana);font-size:19px;color:var(--paper)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* child mode: bigger targets and text */

body.kid .btn,body.kid .tool{min-height:58px;font-size:17px}

body.kid .wstat{font-size:18px}

  let s = STR[LANG][key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  if (typeof s === 'function') return s(v || {});

  out = ALL.filter(k => out.includes(k));

function wsample(pool, n) {
  const arr = pool.slice(), out = [];

    let r = Math.random() * tot, i = 0;
    for (; i < arr.length; i++) { r -= weight(arr[i]); if (r <= 0) break; }
    out.push(arr.splice(Math.min(i, arr.length - 1), 1)[0]);

}
